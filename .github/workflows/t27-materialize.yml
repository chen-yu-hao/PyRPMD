name: T27 materialize staged changes

on:
  push:
    branches:
      - agent/t27-native-threading

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize validated source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .t27-bundle/chunk-* > /tmp/t27-bundle.tar.gz
          echo '236b2e4b3253fc9004be9f807114b018881275e3cd3d6718c46704082a65f4e5  /tmp/t27-bundle.tar.gz' | sha256sum -c -
          tar -xzf /tmp/t27-bundle.tar.gz
          rm -rf .t27-bundle .github/workflows/t27-materialize.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            native/builtin_pes.hpp \
            native/builtin_pes_part1.hpp \
            native/builtin_pes_part2.hpp \
            native/builtin_pes_part3.hpp \
            native/builtin_pes_part4.hpp \
            src/pyrpmd/potentials/builtin.py \
            src/pyrpmd/potentials/_builtin_native.py \
            src/pyrpmd/potentials/__init__.py \
            tests/test_builtin_lj.py \
            .t27-bundle \
            .github/workflows/t27-materialize.yml
          git commit -m 'Add periodic Lennard-Jones C ABI v2 potential'

          git add \
            benchmarks/efficiency/benchmark_native_threading.py \
            docs/builtin-native-potentials.md \
            docs/validation/native-threading-2026-11-03
          git commit -m 'Document and benchmark native threading'
          git push origin HEAD:agent/t27-native-threading
