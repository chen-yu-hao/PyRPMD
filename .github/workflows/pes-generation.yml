name: Caracal and PySCF PES generation
on:
  push:
    branches: ['feat/caracal-pes-generation-20261031']
    paths: ['.github/workflows/pes-generation.yml', 'src/pyrpmd/pesgen/**', 'tests/test_pesgen*', 'examples/pesgen/**', 'pyproject.toml', 'MANIFEST.in']
  pull_request:
    paths: ['.github/workflows/pes-generation.yml', 'src/pyrpmd/pesgen/**', 'tests/test_pesgen*', 'examples/pesgen/**', 'pyproject.toml', 'MANIFEST.in']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pes-generation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-and-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYRPMD_PESGEN_FULL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native and electronic-structure dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin libfftw3-dev liblapack-dev python3-dev
          python -m pip install -e '.[test,pesgen]' 'pyscf==2.14.0'
      - name: Fetch and build the source-pinned upstream
        run: |
          git clone https://github.com/Trebonius91/Caracal.git reference-sources/Caracal
          git -C reference-sources/Caracal checkout 7f95ce9818b7f6d81d7cb3b634f360373c090820
          python -m pyrpmd.pesgen build-native reference-sources/Caracal native-build
          python -m pip freeze > native-build/python-packages.txt
      - name: Real PySCF, QMDFF, EVB and TREQ checks
        run: |
          set -o pipefail
          export PYRPMD_PESGEN_BUILD="$PWD/native-build"
          export PYRPMD_CARACAL_SOURCE="$PWD/reference-sources/Caracal"
          python -m pytest -q tests/test_pesgen.py tests/test_pesgen_native.py \
            --basetemp=pesgen-tests --junitxml=pesgen-junit.xml | tee pesgen-tests.log
      - name: Package resources outside the source tree
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m venv /tmp/pesgen-wheel
          /tmp/pesgen-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/pesgen-wheel/bin/python -c 'from importlib.resources import files; p=files("pyrpmd.pesgen")/"_native"; assert (p/"worker.f90").is_file(); assert (p/"bridge.cpp").is_file(); assert (p/"pes_api_v1.h").is_file()'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pes-generation-validation
          path: |
            pesgen-tests.log
            pesgen-junit.xml
            native-build/build.json
            native-build/*.log
            native-build/python-packages.txt
            native-build/Caracal/pyrpmd-safety.patch
            pesgen-tests/**/summary.json
            pesgen-tests/**/manifest.json
            pesgen-tests/**/references/*.json
            pesgen-tests/**/generate.log
            pesgen-tests/**/fit.log
          retention-days: 7
