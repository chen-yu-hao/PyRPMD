name: Fused native propagation
on:
  push:
    branches: [main, feat/fused-native-propagation, 'integration/**']
    paths: ['src/pyrpmd/**', 'native/**', 'benchmarks/**', 'tests/**', 'pyproject.toml', 'setup.py', 'MANIFEST.in', '.github/workflows/fused-native.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fused-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  fused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMPI_MCA_rmaps_base_oversubscribe: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin
          python -m pip install -e '.[test,ase,mpi]' build 'setuptools>=68' wheel
      - name: Build pinned real BKMP2
        run: python benchmarks/h3/build_pes.py
      - name: Unit and compatibility tests
        run: |
          mkdir -p runs
          python -m pytest -q | tee runs/fused-tests.txt
      - name: Actual 4-rank MPI regression
        run: |
          mpiexec -n 4 python tests/mpi_integration.py | tee runs/fused-mpi.txt
          mpiexec -n 4 python tests/mpi_workflow_smoke.py "$RUNNER_TEMP/pyrpmd-fused-mpi" | tee runs/fused-mpi-workflows.txt
      - name: Fused real-system observations, restart and timing
        run: python benchmarks/h3/fused_propagation.py --output runs/fused-native.json
      - name: Build packages
        run: python -m build
      - name: Rebuild and test source distribution
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tarfile

          archives = list(Path('dist').glob('*.tar.gz'))
          assert len(archives) == 1, archives
          target = Path(os.environ['RUNNER_TEMP']) / 'pyrpmd-sdist'
          with tarfile.open(archives[0]) as archive:
              archive.extractall(target, filter='data')
          roots = [path for path in target.iterdir() if path.is_dir()]
          assert len(roots) == 1, roots
          required = [
              'native/fused.hpp', 'native/include/pyrpmd/pes_api_v1.h',
              'benchmarks/h3/fused_propagation.py',
              'benchmarks/h3/source.json', 'benchmarks/h3/wrapper.f90',
              'benchmarks/loop_native/benchmark.py',
              'benchmarks/loop_native/cayley_common.h',
              'benchmarks/loop_native/loop_c.c',
              'benchmarks/loop_native/loop_cpp.cpp',
              'benchmarks/loop_native/loop_fortran.f90',
              'tests/test_fused_propagation.py',
          ]
          for relative in required:
              assert (roots[0] / relative).is_file(), relative
          PY
          cd "$RUNNER_TEMP"/pyrpmd-sdist/pyrpmd-*
          python setup.py build_ext --inplace
          export PYTHONPATH="$PWD/src:$PWD"
          python - <<'PY'
          from pathlib import Path
          from pyrpmd import _native
          assert Path(_native.__file__).resolve().is_relative_to(Path.cwd())
          assert callable(_native.run_block)
          from benchmarks.h3 import fused_propagation
          print('Source distribution imports its rebuilt native extension and real-system harness')
          PY
          python benchmarks/h3/build_pes.py --source "$GITHUB_WORKSPACE/benchmarks/h3/build/h3_bkmp2.f"
          python -m pytest -q tests/test_fused_propagation.py | tee "$GITHUB_WORKSPACE/runs/fused-sdist-tests.txt"
      - name: Reproducible source snapshot
        if: always()
        run: |
          mkdir -p runs
          git archive --format=tar.gz HEAD -o runs/fused-source.tar.gz
          git rev-parse HEAD > runs/fused-source-commit.txt
      - name: Results and build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fused-native-results
          path: |
            runs/fused-*
            benchmarks/h3/build/h3_bkmp2.f
            benchmarks/h3/build/libbkmp2.so
            benchmarks/h3/build/libbkmp2.build.json
            dist/
          retention-days: 14
