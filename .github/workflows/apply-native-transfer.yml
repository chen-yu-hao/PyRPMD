name: Apply verified native propagation patch
on:
  push:
    branches: [feat/fused-native-propagation]
    paths: ['.native-transfer/**', '.github/workflows/apply-native-transfer.yml']
permissions:
  contents: write
jobs:
  apply-test:
    if: github.ref == 'refs/heads/feat/fused-native-propagation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fused-native-propagation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compatibility guard tests and implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          data=Path('.native-transfer/compat.patch').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='bfdca635dd2980d50674bcd9e19423503e7658fccb72c6f7614200d6b426116d'
          PY
          git apply --check .native-transfer/compat.patch
          git apply --index .native-transfer/compat.patch
          git rm -r .native-transfer
          git config user.name 'chen-yu-hao'
          git config user.email '72141038+chen-yu-hao@users.noreply.github.com'
          git commit -m 'fix: preserve dynamically overridden Python PES and nested CV semantics'
          echo "PYRPMD_TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p runs
          git show --stat HEAD > runs/tested-commit.txt
      - name: Build real PES and install package
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python -m pip install -e '.[test,ase]' build
          python benchmarks/h3/build_pes.py
      - name: Full regression and real-system measurements
        run: |
          python -m pytest -q | tee runs/pytest.txt
          python benchmarks/h3/fused_propagation.py --output runs/fused-native.json
          python -m build
      - name: Publish tested implementation
        run: git push origin HEAD:refs/heads/feat/fused-native-propagation
      - name: Preserve tested sources
        if: always()
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/fused-tested-source.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fused-verified-results
          path: |
            runs/
            dist/
            benchmarks/h3/build/libbkmp2.build.json
            ${{ runner.temp }}/fused-tested-source.tar
