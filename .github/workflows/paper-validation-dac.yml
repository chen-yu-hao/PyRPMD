name: DAC paper physical validation
on:
  push:
    paths:
      - 'benchmarks/paper_validation/dac_*'
      - 'benchmarks/paper_validation/independent_tully_dac.py'
      - 'tests/test_dac_paper_validation.py'
      - '.github/workflows/paper-validation-dac.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dac-paper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  physical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Validate exact mapping equivalence, electronic trace, and author data schema
        run: python -m pytest -q tests/test_dac_paper_validation.py
      - name: Independently reproduce author p5 and p15 quantum curves
        run: python benchmarks/paper_validation/independent_tully_dac.py --case both --output dac_quantum.json
      - name: Quantify MMST/W focused, full-sphere W, and Ehrenfest differences
        run: |
          python benchmarks/paper_validation/dac_spin_statistical.py --momentum 5 --n 2048 --dt 4 --seed 731 --output dac_p5_validation.json
          python benchmarks/paper_validation/dac_spin_statistical.py --momentum 15 --n 2048 --dt 4 --seed 731 --output dac_p15_validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: dac-paper-quantum-and-method-comparisons
          path: |
            dac_quantum.json
            dac_p5_validation.json
            dac_p15_validation.json
