name: Analysis reports

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figures:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,plots]'
      - run: python -m pytest -q tests/test_report*.py
      - name: Run saved-data report examples
        run: |
          pyrpmd run examples/manual/quickstart.inp --output "$RUNNER_TEMP/analysis-1d" --report
          pyrpmd run examples/fes/harmonic2d.inp --output "$RUNNER_TEMP/analysis-2d"
          pyrpmd report "$RUNNER_TEMP/analysis-2d" --formats png pdf svg --output "$RUNNER_TEMP/fes-report"
          pyrpmd analyze "$RUNNER_TEMP/analysis-2d" --report --report-output "$RUNNER_TEMP/analyze-report"
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-report-examples
          path: |
            ${{ runner.temp }}/analysis-1d/analysis-report
            ${{ runner.temp }}/fes-report
            ${{ runner.temp }}/analyze-report
          if-no-files-found: error
