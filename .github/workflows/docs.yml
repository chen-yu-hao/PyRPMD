name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manual:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          # Validate immutable source links against their exact historical tree.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[docs]'
      - name: Exercise documentation link checker regressions
        run: python -m unittest discover -s docs/_tools -p 'test_*.py' -v
      - name: Build searchable HTML and single-page manual (English, Chinese under zh/)
        run: |
          python -m sphinx -W --keep-going -b html docs docs/_build/html
          python -m sphinx -W --keep-going -b html docs/zh docs/_build/html/zh
          python -m sphinx -W --keep-going -b singlehtml docs docs/_build/singlehtml
          python -m sphinx -W --keep-going -b singlehtml docs/zh docs/_build/singlehtml/zh
      - name: Check README size, bilingual structure, local files and anchors
        run: |
          python docs/_tools/check_links.py \
            --html docs/_build/html \
            --html docs/_build/singlehtml \
            --external-project docs/_build/external-links
      - uses: actions/upload-artifact@v4
        with:
          name: pyrpmd-external-link-inventory
          path: docs/_build/external-links
          if-no-files-found: error
      - name: Run the documented quickstart and low-level API
        run: |
          python -m pyrpmd init "$RUNNER_TEMP/manual-starter"
          cd "$RUNNER_TEMP"
          python -m pyrpmd validate manual-starter/quickstart.inp --check-pes --output manual-starter/run
          python -m pyrpmd run manual-starter/quickstart.inp --output manual-starter/run
          python -m pyrpmd analyze manual-starter/run
          python -m pyrpmd resume manual-starter/run
          python -m pyrpmd analyze manual-starter/run --recompute --bins 8 --bootstrap 10
          cd "$GITHUB_WORKSPACE"
          python examples/manual/low_level.py
      - name: Run the experimental state-selected NRPMD tutorial
        run: |
          pyrpmd validate examples/nonadiabatic/exchange.inp --check-pes
          pyrpmd run examples/nonadiabatic/exchange.inp --workers 2 --output "$RUNNER_TEMP/manual-nrpmd"
          pyrpmd resume "$RUNNER_TEMP/manual-nrpmd" --block-steps 32
          pyrpmd analyze "$RUNNER_TEMP/manual-nrpmd"
      - name: Run nonadiabatic model APIs and electronic-friction tutorial
        run: |
          python examples/nonadiabatic/soc_and_rpsh.py
          python examples/nonadiabatic/thermal_rates.py
          python examples/nonadiabatic/method_models.py
          pyrpmd validate examples/nonadiabatic/friction_surface.inp --check-pes
          pyrpmd run examples/nonadiabatic/friction_surface.inp --output "$RUNNER_TEMP/manual-ef-rpmd"
          pyrpmd resume "$RUNNER_TEMP/manual-ef-rpmd"
      - uses: actions/upload-artifact@v4
        with:
          name: pyrpmd-manual-html
          path: |
            docs/_build/html
            docs/_build/singlehtml
          if-no-files-found: error

  external-links:
    name: External documentation links
    needs: manual
    # A branch push and its PR run use the same URLs; check the PR, not both.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'sphinx>=8.2,<9'
      - uses: actions/download-artifact@v4
        with:
          name: pyrpmd-external-link-inventory
          path: external-links
      - name: Check HTTP targets from both READMEs and both rendered manuals
        # Bound even a server's excessive Retry-After while leaving time for logs.
        run: timeout 25m python -m sphinx -W --keep-going -b linkcheck external-links linkcheck-results
      - name: Require a completed successful check for every exported URL
        if: always()
        run: python external-links/check_external_results.py linkcheck-results/output.json external-links/sources.json
      - name: Preserve linkcheck results and source locations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyrpmd-external-link-results
          path: |
            linkcheck-results
            external-links/sources.json
          if-no-files-found: error
