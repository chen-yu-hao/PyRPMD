name: PyRPMD real BKMP2 loop-language benchmark

on:
  push:
    branches:
      - main
      - bench/native-loop-bkmp2-20261030
    paths:
      - 'benchmarks/loop_native/**'
      - 'benchmarks/h3/**'
      - 'native/cayley.cpp'
      - 'src/pyrpmd/dynamics.py'
      - '.github/workflows/loop-language-benchmark.yml'
  pull_request:
    paths:
      - 'benchmarks/loop_native/**'
      - 'benchmarks/h3/**'
      - 'native/cayley.cpp'
      - 'src/pyrpmd/dynamics.py'
      - '.github/workflows/loop-language-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-bkmp2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install C / C++ / Fortran toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran gcc g++
      - name: Install actual PyRPMD with native Cayley extension
        run: python -m pip install -e '.[test]'
      - name: Verify authors' H3 BKMP2 PES and compile Fortran batch library
        run: |
          python benchmarks/h3/build_pes.py
          python benchmarks/h3/pes.py --check
      - name: Run real H3/BKMP2 16 and 32 bead comparison
        run: |
          python benchmarks/loop_native/benchmark.py --potential real --sizes 16 32 \
            --steps 2500 --repeats 3 --pin-cpu \
            --output runs/loop-language/real-bkmp2.json
      - name: Run independent synthetic harmonic control
        run: |
          python benchmarks/loop_native/benchmark.py --potential toy --sizes 16 32 \
            --steps 10000 --repeats 3 --pin-cpu \
            --output runs/loop-language/toy-control.json
      - name: Upload raw timings and correctness comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyrpmd-loop-languages-h3-bkmp2
          path: |
            runs/loop-language/*.json
            benchmarks/h3/build/*.build.json
          if-no-files-found: warn
          retention-days: 30
