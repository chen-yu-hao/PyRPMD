name: Paper-level nonadiabatic validation pilot
on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/paper_validation/**'
      - '.github/workflows/paper-validation.yml'
permissions:
  contents: read
concurrency:
  group: paper-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quantum-soft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python benchmarks/paper_validation/independent_soft.py --output quantum_soft_convergence.json
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-tully-sac-soFT-grid-convergence
          path: quantum_soft_convergence.json
  tully-sac-p10:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: 256-trajectory single-bead dt 4 quantum comparison
        run: python benchmarks/paper_validation/tully_sac_pilot.py --n 256 --dt 4 --seed 731 --output validation_sac_p10_dt4.json
      - name: 128-trajectory single-bead dt 8 quantum comparison
        run: python benchmarks/paper_validation/tully_sac_pilot.py --n 128 --dt 8 --seed 731 --output validation_sac_p10_dt8.json
      - uses: actions/upload-artifact@v4
        with:
          name: tully-sac-p10-trajectory-data
          path: |
            validation_sac_p10_dt4.json
            validation_sac_p10_dt8.json
