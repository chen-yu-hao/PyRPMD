name: T35 source snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/t35-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create source snapshot
        run: tar --exclude=.git -czf pyrpmd-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pyrpmd-t35-source
          path: pyrpmd-source.tar.gz
          if-no-files-found: error
          retention-days: 1
