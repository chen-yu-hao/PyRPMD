name: Sampling / real PLUMED

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plumed:
    name: PLUMED 2.9.4 / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Official v2.9.4 tag; kernel and Python wrapper use the same source.
      # https://github.com/plumed/plumed2/tree/52da2bb76d37dbad0d19f59c6fe0b2ab939e3ded
      PYRPMD_PLUMED_COMMIT: 52da2bb76d37dbad0d19f59c6fe0b2ab939e3ded
      PYRPMD_PLUMED_PREFIX: ${{ runner.temp }}/pyrpmd-plumed
      PLUMED_KERNEL: ${{ runner.temp }}/pyrpmd-plumed/lib/libplumedKernel.so
      PYRPMD_REQUIRE_PLUMED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libblas-dev liblapack-dev zlib1g-dev pkg-config
          python -m pip install -e '.[test]' 'Cython==3.0.12' 'setuptools>=77,<81' wheel

      - name: Cache the installed kernel and matching wrapper wheel
        id: plumed-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PYRPMD_PLUMED_PREFIX }}
          key: plumed-ubuntu24.04-${{ runner.arch }}-py312-${{ env.PYRPMD_PLUMED_COMMIT }}-${{ hashFiles('.github/workflows/sampling.yml') }}

      - name: Check out the pinned official PLUMED source
        if: steps.plumed-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: plumed/plumed2
          ref: ${{ env.PYRPMD_PLUMED_COMMIT }}
          path: .plumed-source
          persist-credentials: false

      - name: Build the minimal shared kernel and matching Python wheel
        if: steps.plumed-cache.outputs.cache-hit != 'true'
        working-directory: .plumed-source
        run: |
          test "$(git rev-parse HEAD)" = "$PYRPMD_PLUMED_COMMIT"
          # Official build/module guidance:
          # https://www.plumed.org/doc-v2.9/user-doc/html/_installation.html
          # https://www.plumed.org/doc-v2.9/user-doc/html/mymodules.html
          # generic needs xdrfile; colvar needs reference. Core/tools are always built.
          ./configure --prefix="$PYRPMD_PLUMED_PREFIX" \
            --enable-shared --disable-mpi --disable-openmp --disable-gsl \
            --disable-python --disable-asmjit --disable-static-archive --disable-static-patch \
            --enable-modules=none:setup:colvar:reference:bias:generic:xdrfile \
            CXXFLAGS='-O2' 2>&1 | tee "$RUNNER_TEMP/plumed-configure.log"
          make -j2 lib 2>&1 | tee "$RUNNER_TEMP/plumed-build.log"
          make install 2>&1 | tee "$RUNNER_TEMP/plumed-install.log"
          # The pinned source's documented `make pip` target copies its wrapper
          # header and release version before building the source-matched wheel.
          make -C python pip
          python -m pip wheel --no-build-isolation --no-deps ./python \
            --wheel-dir "$PYRPMD_PLUMED_PREFIX/wheels"
          printf '%s\n' "$PYRPMD_PLUMED_COMMIT" > "$PYRPMD_PLUMED_PREFIX/source-commit.txt"

      - name: Install and require the pinned live runtime
        run: |
          python -m pip install --no-deps "$PYRPMD_PLUMED_PREFIX"/wheels/plumed-2.9.4-*.whl
          python - <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import numpy as np
          import plumed

          prefix = Path(os.environ['PYRPMD_PLUMED_PREFIX'])
          commit = prefix.joinpath('source-commit.txt').read_text().strip()
          assert commit == os.environ['PYRPMD_PLUMED_COMMIT']
          assert importlib.metadata.version('plumed') == '2.9.4'
          assert Path(os.environ['PLUMED_KERNEL']).is_file()
          with plumed.Plumed() as kernel:
              api = np.zeros(1, dtype=np.intc)
              kernel.cmd('getApiVersion', api)
              assert api[0] >= 8
          evidence = {
              'source_commit': commit, 'wrapper_version': '2.9.4',
              'kernel_path': os.environ['PLUMED_KERNEL'], 'api_version': int(api[0]),
              'modules': ['setup', 'colvar', 'reference', 'bias', 'generic', 'xdrfile'],
              'mpi': False, 'openmp': False,
          }
          Path(os.environ['RUNNER_TEMP'], 'plumed-runtime.json').write_text(
              json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY

      - name: Test the bridge against the real kernel
        run: |
          python -m pytest -q tests/test_plumed.py \
            --basetemp "$RUNNER_TEMP/plumed-tests" \
            --junitxml "$RUNNER_TEMP/plumed-junit.xml"

      - name: Run the executable centroid METAD example
        run: |
          python examples/plumed/centroid_metadynamics.py \
            --steps 200 --output "$RUNNER_TEMP/plumed-example"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP'], 'plumed-example')
          summary = json.loads(output.joinpath('summary.json').read_text())
          assert summary['completed_steps'] == 200
          assert summary['converged'] is False
          def rows(name):
              return [line for line in output.joinpath(name).read_text().splitlines()
                      if line.strip() and not line.lstrip().startswith('#')]
          assert len(rows('HILLS')) == 10
          assert len(rows('COLVAR')) == 20
          PY

      - name: Preserve live-runtime evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampling-plumed-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/plumed-*.log
            ${{ runner.temp }}/plumed-runtime.json
            ${{ runner.temp }}/plumed-junit.xml
            ${{ runner.temp }}/plumed-tests/**
            ${{ runner.temp }}/plumed-example/**
