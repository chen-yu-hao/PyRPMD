name: Reproducible paper-validation source snapshot
on:
  push:
    paths:
      - '.github/workflows/paper-validation-source-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package exact source and published quantum anchors
        run: |
          tar -czf pyrpmd-paper-validation-source.tar.gz src benchmarks/paper_validation tests pyproject.toml README.md
          sha256sum pyrpmd-paper-validation-source.tar.gz
          head -n 6 benchmarks/paper_validation/dac_p15_liu2024_reference.csv
          head -n 6 benchmarks/paper_validation/dac_p5_liu2024_reference.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pyrpmd-paper-validation-source-with-authors-dac-refs
          path: pyrpmd-paper-validation-source.tar.gz
