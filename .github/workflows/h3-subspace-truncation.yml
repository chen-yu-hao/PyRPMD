name: H + H2 exact-rate truncation study

# Convergence of the energy-truncated DVR exact rate of collinear H + H2 (BKMP2)
# in the truncation energy and the grid spacing (benchmarks/h3_subspace/run.py,
# docs/validation/2026-11-09-subspace-transfer). Read-only; results in artifacts and log.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/subspace-transfer-theory'
    paths:
      - '.github/workflows/h3-subspace-truncation.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  point:
    name: H3 ${{ matrix.temperature }} K trunc ${{ matrix.truncation }} dx ${{ matrix.spacing }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        temperature: [600, 400, 300, 200, 150]
        truncation: [0.07, 0.10, 0.13, 0.16]
        spacing: [2.0]
        include:
          - {temperature: 200, truncation: 0.13, spacing: 1.75}
          - {temperature: 150, truncation: 0.13, spacing: 1.75}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python -m pip install -e .
      - run: python benchmarks/h3/build_pes.py
      - name: Exact rate
        run: |
          name="h3-${{ matrix.temperature }}K-t${{ matrix.truncation }}-dx${{ matrix.spacing }}"
          python benchmarks/h3_subspace/run.py quantum --temperature ${{ matrix.temperature }} \
            --spacing ${{ matrix.spacing }} --truncation ${{ matrix.truncation }} > "$name.json"
          python -c "import json,sys; d=json.load(open('$name.json')); print('H3TRUNC', d['temperature'], ${{ matrix.truncation }}, d['spacing'], d['k'], d['diagnostics']['retained_points'], round(d['seconds']))"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.json

  aggregate:
    needs: point
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: h3-*
          merge-multiple: true
          path: points
      - name: Table
        run: |
          python - <<'PY'
          import glob, json
          rows = []
          for f in sorted(glob.glob("points/*.json")):
              d = json.load(open(f))
              rows.append((d["temperature"], d["spacing"], f.split("-t")[1].split("-dx")[0], d["k"], d["diagnostics"]["retained_points"]))
          for r in sorted(rows, key=lambda r: (-r[0], -r[1], float(r[2]))):
              print("TABLE T=%g dx=%g trunc=%s k=%.6e points=%d" % r)
          json.dump(rows, open("h3-truncation.json", "w"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h3-truncation
          path: h3-truncation.json
