name: FES rate postprocessing and real H3

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/pyrpmd/analysis/rate_*.py'
      - 'src/pyrpmd/workflows/fes.py'
      - 'src/pyrpmd/input.py'
      - 'src/pyrpmd/cli.py'
      - 'benchmarks/h3/rate_postprocess.py'
      - 'tests/test_rate_postprocess*.py'
      - 'tests/test_h3_rate_postprocess.py'
      - '.github/workflows/rate-postprocess.yml'
  pull_request:
    paths:
      - 'src/pyrpmd/analysis/rate_*.py'
      - 'src/pyrpmd/workflows/fes.py'
      - 'src/pyrpmd/input.py'
      - 'src/pyrpmd/cli.py'
      - 'benchmarks/h3/rate_postprocess.py'
      - 'tests/test_rate_postprocess*.py'
      - 'tests/test_h3_rate_postprocess.py'
      - '.github/workflows/rate-postprocess.yml'

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  h3-rate-postprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python -m pip install -e '.[test]'
      - name: Analytic flux, signed branching and saved-data contracts
        run: python -m pytest -q tests/test_rate_postprocess_core.py tests/test_rate_postprocess_science.py tests/test_rate_postprocess_io.py tests/test_h3_rate_postprocess.py
      - name: Build the pinned BKMP2 potential
        run: python benchmarks/h3/build_pes.py
      - name: Check BKMP2 against its independent oracle and finite differences
        run: python benchmarks/h3/pes.py --check --output validation/pes-check.json
      - name: Real H plus H2 joint FES and signed exchange channels
        run: python benchmarks/h3/rate_postprocess.py --profile quick --workers 2 --output validation/h3-rate-postprocess
      - name: Exercise the public offline CLI
        run: pyrpmd rate-postprocess validation/h3-rate-postprocess/run --spec validation/h3-rate-postprocess/rate-postprocess-spec.json --output validation/h3-rate-postprocess/cli-postprocess.json
      - name: Preserve raw samples, channel fluxes and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: h3-rate-postprocess
          path: validation/
          if-no-files-found: error
          retention-days: 30
