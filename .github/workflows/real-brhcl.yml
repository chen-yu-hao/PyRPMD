name: BrHCl multichannel PMF regression
on:
  pull_request:
    paths:
      - 'benchmarks/brhcl/**'
      - 'src/pyrpmd/**'
      - 'native/**'
      - 'tests/test_brhcl_*'
      - 'tests/test_fes_extra_correlation.py'
      - 'tests/test_cabi_lifecycle.py'
      - '.github/workflows/real-brhcl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-pes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python -m pip install -e '.[test]'
      # The builder verifies the pinned upstream SHA256. Building before pytest
      # makes the optional native-PES regressions execute rather than skip.
      - run: python benchmarks/brhcl/build_pes.py
      - run: >-
          python -m pytest -q tests/test_brhcl_*.py
          tests/test_fes_extra_correlation.py tests/test_cabi_lifecycle.py
          tests/test_pmf_1d_accuracy.py tests/test_pmf_2d_accuracy.py
          --junitxml=brhcl-regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brhcl-pmf-regression
          path: brhcl-regression.xml
