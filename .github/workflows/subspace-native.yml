name: Subspace native regression

on:
  push:
    branches: [perf/subspace-native-parallel-20261110]
  pull_request:
    paths:
      - 'native/subspace*'
      - 'src/pyrpmd/analysis/subspace*'
      - 'tests/test_subspace*'
      - 'benchmarks/subspace_performance.py'
      - 'setup.py'
      - '.github/workflows/subspace-native.yml'

permissions:
  contents: read

concurrency:
  group: subspace-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate workflow policy
        run: python tools/check_workflow_policy.py
      - name: Archive exact tested source
        run: |
          git rev-parse HEAD > source-commit.txt
          git archive --format=tar.gz HEAD -o subspace-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: subspace-source-${{ github.sha }}
          path: |
            subspace-source.tar.gz
            source-commit.txt
          retention-days: 7
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Subspace correction and transfer regression
        run: python -m pytest -q tests/test_subspace_correction.py tests/test_subspace_transfer.py --junitxml=subspace-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subspace-tests-${{ github.sha }}
          path: subspace-tests.xml
          retention-days: 14
