name: Portable wheels and release
on:
  pull_request:
    paths: ['src/**', 'native/**', 'tests/wheel_smoke.py', 'pyproject.toml', 'setup.py', 'MANIFEST.in', '.github/workflows/wheels.yml', 'packaging/**']
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Build only, or publish this version tag after environment approval'
        type: choice
        options: [none, testpypi, pypi]
        default: none
permissions:
  contents: read
concurrency:
  group: wheels-${{ github.ref }}-${{ inputs.publish_target || 'none' }}
  cancel-in-progress: false
jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release identity
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          PUBLISH_TARGET: ${{ inputs.publish_target || 'none' }}
        run: |
          python - <<'PY'
          import ast, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          module = ast.parse(pathlib.Path('src/pyrpmd/__init__.py').read_text())
          declared = next(ast.literal_eval(n.value) for n in module.body
                          if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert version == declared, (version, declared)
          if os.environ['RELEASE_REF_TYPE'] == 'tag':
              assert os.environ['RELEASE_REF_NAME'] == 'v' + version, 'tag must match package version'
          if os.environ['PUBLISH_TARGET'] != 'none':
              assert os.environ['RELEASE_REF_TYPE'] == 'tag', 'publishing requires a version tag'
          PY
      - run: python -m pip install build twine
      - run: python -m build --sdist && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
  wheels:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-2022
            arch: AMD64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build every wheel from the same source archive
        shell: bash
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        run: |
          python -m pip install cibuildwheel==3.4.0
          python -m cibuildwheel source/*.tar.gz --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  verify:
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install twine packaging
      - run: python -m twine check --strict dist/*
      - name: Verify wheel coverage and write checksums
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 12, [p.name for p in wheels]
          actual = {(tag.interpreter, 'linux' if 'manylinux' in tag.platform else 'macos' if 'macosx' in tag.platform else 'windows')
                    for p in wheels for tag in parse_wheel_filename(p.name)[3]}
          expected = {(f'cp{v}', platform) for v in ('311', '312', '313', '314') for platform in ('linux', 'macos', 'windows')}
          assert actual == expected, (actual, expected)
          assert len(list(Path('dist').glob('*.tar.gz'))) == 1
          Path('checksums.json').write_text(json.dumps({p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                                                      for p in sorted(Path('dist').iterdir())}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: checksums.json
  publish:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'tag' &&
      inputs.publish_target != 'none' &&
      vars.PYRPMD_ENABLE_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.publish_target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist
      - name: Publish to TestPyPI
        if: inputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.publish_target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
