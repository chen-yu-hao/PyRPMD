name: Native propagation validation
on:
  push:
    branches: [feat/native-propagation]
  pull_request:
    paths: ['native/**', 'src/**', 'tests/**', 'benchmarks/**', '.github/workflows/native-fusion.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-fusion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fused-bkmp2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and build
        run: |
          python -m pip install -e '.[test]'
          python benchmarks/h3/build_pes.py
      - name: Numerical and workflow regression
        run: python -m pytest -q
      - name: Fused propagation benchmark
        run: |
          if test -f benchmarks/h3/fused_propagation.py; then
            python benchmarks/h3/fused_propagation.py --output runs/native-fusion/report.json
          fi
      - name: Reproducible source snapshot
        if: always()
        run: |
          mkdir -p runs/native-fusion
          git archive --format=tar HEAD > runs/native-fusion/checkout.tar
          git rev-parse HEAD > runs/native-fusion/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fusion-evidence
          path: |
            runs/native-fusion/
            benchmarks/h3/build/h3_bkmp2.f
            benchmarks/h3/build/libbkmp2.build.json
          retention-days: 14
