name: T32 development
on:
  push:
    branches:
      - agent/t32-scalable-instanton
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baseline:
    if: github.event.head_commit.message == 'ci: record T32 relevant baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Relevant baseline
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -o pipefail
          python -m pytest -q tests -k 'instanton or low_temperature or tunnelling' | tee t32-pytest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t32-test-log
          path: t32-pytest.txt
          if-no-files-found: ignore
  apply:
    if: github.event.head_commit.message == 'build: apply T32 implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Materialize implementation
        run: |
          cat .github/t32/payload-* > /tmp/t32-payload
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path
          payload = Path('/tmp/t32-payload').read_text().encode()
          source = zlib.decompress(base64.b85decode(payload)).decode()
          exec(compile(source, '<t32-apply>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Install test environment
        run: python -m pip install -e '.[test]'
      - name: Focused implementation tests
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q tests/test_instanton_structured.py tests/test_instanton.py tests/test_low_temperature.py tests/test_instanton_workflow.py
          python examples/instanton/structured_scaling.py --quick
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'openai-codex'
          git config user.email 'openai-codex@users.noreply.github.com'
          git rm .github/t32/payload-*
          git add src/pyrpmd/instanton_algebra.py src/pyrpmd/instanton.py src/pyrpmd/low_temperature.py src/pyrpmd/workflows/instanton.py tests/test_instanton_structured.py tests/test_instanton_workflow.py examples/instanton/structured_scaling.py docs/instanton.md
          git commit -m 'feat: add scalable structured instanton algebra'
          git push origin HEAD:agent/t32-scalable-instanton