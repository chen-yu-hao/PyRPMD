name: T32 development
on:
  push:
    branches:
      - agent/t32-scalable-instanton
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relevant:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test environment
        run: python -m pip install -e '.[test]'
      - name: Run T32 baseline
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -o pipefail
          python -m pytest -q tests -k 'instanton or low_temperature or tunnelling' | tee t32-pytest.txt
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t32-test-log
          path: t32-pytest.txt
          if-no-files-found: ignore
