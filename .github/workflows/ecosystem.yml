name: Ecosystem interoperability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-engines-and-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OPENMM_CPU_THREADS: '1'
      # This job uses one host. Hosted runners can expose RDMA devices whose
      # verbs operations are unavailable to the MPICH wheel's UCX runtime.
      UCX_TLS: 'tcp,sm,self'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual engines and external trajectory readers
        run: python -m pip install -e '.[test,ase,openmm,lammps]' MDAnalysis mpich mpi4py
      - name: Expose wheel-provided MPICH libraries
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import sys
          print(f"LD_LIBRARY_PATH={sys.prefix}/lib:" + os.environ.get("LD_LIBRARY_PATH", ""))
          PY
      - name: Require working runtimes before tests
        run: |
          python - <<'PY'
          import ase
          import h5py
          import MDAnalysis
          import openmm
          from lammps import lammps
          print("OpenMM", openmm.__version__)
          print("ASE", ase.__version__, "MDAnalysis", MDAnalysis.__version__, "h5py", h5py.__version__)
          engine = lammps(cmdargs=["-log", "none", "-screen", "none"])
          assert engine.extract_setting("world_size") == 1
          print("LAMMPS", engine.version())
          engine.close()
          PY
      - name: Engine physics contracts and external-reader roundtrips
        run: |
          python -m pytest -q \
            tests/test_openmm_provider.py tests/test_lammps_provider.py \
            tests/test_openmm_batch_provider.py tests/test_lammps_batch_provider.py \
            tests/test_engine_subcommunicators.py \
            tests/test_trajectory_export.py tests/test_bond_constraints.py \
            tests/test_constraint_workflow_guards.py \
            tests/test_qtip4pf_benchmark.py tests/test_water_campaign.py \
            tests/test_literature_evidence.py
      - name: Public OpenMM and LAMMPS workflows
        run: |
          pyrpmd validate examples/potentials/openmm_harmonic.inp --check-pes
          pyrpmd run examples/potentials/openmm_harmonic.inp --output "$RUNNER_TEMP/openmm-example"
          pyrpmd resume "$RUNNER_TEMP/openmm-example"
          pyrpmd validate examples/potentials/lammps_lj.inp --check-pes
          pyrpmd run examples/potentials/lammps_lj.inp --output "$RUNNER_TEMP/lammps-example"
          pyrpmd resume "$RUNNER_TEMP/lammps-example"
          pyrpmd export "$RUNNER_TEMP/openmm-example" "$RUNNER_TEMP/openmm.extxyz"
          pyrpmd export "$RUNNER_TEMP/lammps-example" "$RUNNER_TEMP/lammps.h5md"
          pyrpmd export "$RUNNER_TEMP/lammps-example" "$RUNNER_TEMP/lammps.traj"
      - name: Independent LAMMPS contexts in MPI workers
        run: mpiexec -n 2 python tests/mpi_engine_smoke.py
