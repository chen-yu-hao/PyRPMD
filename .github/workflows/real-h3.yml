name: Real H3 BKMP2 validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/h3/**'
      - 'src/pyrpmd/**'
      - 'native/**'
      - 'tests/test_h3_*.py'
      - 'tests/test_equivalent_surfaces.py'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/real-h3.yml'
  pull_request:
    paths:
      - 'benchmarks/h3/**'
      - 'src/pyrpmd/**'
      - 'native/**'
      - 'tests/test_h3_*.py'
      - 'tests/test_equivalent_surfaces.py'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/real-h3.yml'

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'

jobs:
  pes-and-numerics:
    name: BKMP2 oracle, forces and NVE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python -m pip install -e '.[test]'
      - run: python benchmarks/h3/build_pes.py
      - run: python benchmarks/h3/pes.py --check --output validation/pes-check.json
      - run: python -m pytest -q tests/test_h3_pes.py tests/test_h3_pmf_diagnostics.py tests/test_h3_benchmark_integrity.py tests/test_equivalent_surfaces.py
      - run: python benchmarks/h3/numerics.py --output validation/numerics.json
      - name: Preserve physical validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: h3-pes-numerics
          path: validation/
          if-no-files-found: error
          retention-days: 30

  simulations:
    name: H3 ${{ matrix.stage }} (1500 K, 16 beads)
    needs: pes-and-numerics
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stage: [drpmd, fes2d, rate]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python -m pip install -e '.[test]' matplotlib
      - run: python benchmarks/h3/build_pes.py
      - run: python benchmarks/h3/pes.py --check --output validation/pes-check.json
      - name: Direct reactive collision trajectories
        if: matrix.stage == 'drpmd'
        run: python benchmarks/h3/drpmd.py --output validation/drpmd --workers 2
      - name: RPMD umbrella sampling and recrossing
        if: matrix.stage != 'drpmd'
        run: python benchmarks/h3/rpmd.py --stage ${{ matrix.stage }} --output validation/${{ matrix.stage }} --workers 2 --profile ci
      - name: Recompute the saved gas rate without new dynamics
        if: matrix.stage == 'rate'
        run: pyrpmd rate-postprocess validation/rate/run --output validation/rate/offline-rate.json
      - name: Plot measured data
        run: python benchmarks/h3/render.py validation/${{ matrix.stage }}
      - name: Preserve inputs, raw samples, checkpoints and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: h3-${{ matrix.stage }}
          path: validation/
          if-no-files-found: error
          retention-days: 30

  report:
    name: Collect physical-system results
    needs: [pes-and-numerics, simulations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: h3-*
          path: collected
      - run: python benchmarks/h3/report.py collected --output collected/VALIDATION.md
      - run: cat collected/VALIDATION.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: h3-complete-validation
          path: collected/
          retention-days: 30
