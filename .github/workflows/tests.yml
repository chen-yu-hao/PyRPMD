name: PyRPMD tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMPI_MCA_rmaps_base_oversubscribe: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - run: python -m pip install -e '.[test,ase,mpi]'
      - run: pyrpmd info
      - run: python -m pytest -q
      # Open MPI 5 delegates allocation to PRRTE; pass this explicitly rather
      # than relying only on the legacy OMPI_MCA variable above.
      - run: mpiexec --oversubscribe -n 4 python tests/mpi_integration.py
      - run: mpiexec --oversubscribe -n 5 python tests/mpi_dynamic_integration.py
      - run: mpiexec --oversubscribe -n 4 python tests/mpi_workflow_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-workflows"
      - run: mpiexec --oversubscribe -n 4 python tests/mpi_adaptive_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-adaptive"
      - run: mpiexec --oversubscribe -n 4 python tests/mpi_opes_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-opes"
      - run: mpiexec --oversubscribe -n 4 python tests/mpi_materials_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-materials"
      - run: mpiexec --oversubscribe -n 4 python tests/mpi_surface_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-surface"
      - run: mpiexec --oversubscribe -n 4 python tests/mpi_surface_extensions_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-surface-extensions"
      - run: python -m pip install build && python -m build
  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: sudo apt-get update && sudo apt-get install -y libfftw3-double3
      - run: python -m pytest -q tests/test_potentials.py tests/test_torch_periodic.py tests/test_torch_backend.py tests/test_torch_paper_validation.py tests/test_torch_observable_validation.py tests/test_torch_bcocb.py tests/test_rpmdrate_normal_modes.py
      - name: Test Torch reference harnesses from the source archive
        run: |
          python -m pip install build
          python -m build --sdist --outdir "$RUNNER_TEMP/torch-sdist"
          python - <<'PY'
          import os, pathlib, subprocess, sys, tarfile
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "torch-sdist"
          archives = list(destination.glob("*.tar.gz"))
          assert len(archives) == 1, archives
          with tarfile.open(archives[0]) as archive:
              archive.extractall(destination / "unpacked", filter="data")
          roots = list((destination / "unpacked").iterdir())
          assert len(roots) == 1, roots
          root = roots[0]
          tests = ["tests/test_torch_backend.py", "tests/test_torch_paper_validation.py",
                   "tests/test_torch_observable_validation.py", "tests/test_torch_bcocb.py",
                   "tests/test_rpmdrate_normal_modes.py"]
          subprocess.run([sys.executable, "-m", "pytest", "-q", *tests], cwd=root,
                         env={**os.environ, "PYTHONPATH": str(root / "src")}, check=True)
          PY
  electronic-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,ase,tblite,pyscf]'
      - run: python -m pytest -q tests/test_potential_adapters.py
