name: PyRPMD tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pyrpmd-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - run: python -m pip install -e '.[test,ase,mpi]'
      - run: pyrpmd info
      - run: python -m pytest -q
      # Use the public CLI modifier: the old OMPI_MCA_rmaps_base_oversubscribe
      # environment variable does not configure the Open MPI 5 PRRTE launcher.
      - run: mpiexec --map-by :OVERSUBSCRIBE -n 4 python tests/mpi_integration.py
      - run: mpiexec --map-by :OVERSUBSCRIBE -n 5 python tests/mpi_dynamic_integration.py
      - run: mpiexec --map-by :OVERSUBSCRIBE -n 4 python tests/mpi_workflow_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-workflows"
      - run: mpiexec --map-by :OVERSUBSCRIBE -n 4 python tests/mpi_adaptive_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-adaptive"
      - run: mpiexec --map-by :OVERSUBSCRIBE -n 4 python tests/mpi_opes_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-opes"
      - run: mpiexec --map-by :OVERSUBSCRIBE -n 4 python tests/mpi_materials_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-materials"
      - name: Materials batch MPI static checkpoint regression
        timeout-minutes: 3
        run: mpiexec --map-by :OVERSUBSCRIBE -n 2 python tests/mpi_materials_batch_integration.py "$RUNNER_TEMP/pyrpmd-mpi-materials-batch-static"
      - name: Materials batch MPI dynamic checkpoint regression
        timeout-minutes: 3
        run: mpiexec --map-by :OVERSUBSCRIBE -n 3 python tests/mpi_materials_batch_integration.py "$RUNNER_TEMP/pyrpmd-mpi-materials-batch-dynamic" --scheduling dynamic
      - run: mpiexec --map-by :OVERSUBSCRIBE -n 4 python tests/mpi_surface_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-surface"
      - run: mpiexec --map-by :OVERSUBSCRIBE -n 4 python tests/mpi_surface_extensions_smoke.py "$RUNNER_TEMP/pyrpmd-mpi-surface-extensions"
      - run: python -m pip install build && python -m build
  torch-cpu:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: sudo apt-get update && sudo apt-get install -y libfftw3-double3
      - run: python -m pytest -q tests/test_potentials.py tests/test_torch_periodic.py tests/test_electronic_backends.py tests/test_batched_nonadiabatic.py tests/test_spin_mapping.py tests/test_advanced_cv.py tests/test_tier2_spectroscopy.py tests/test_ml_lifecycle.py tests/test_spectroscopy_workflow.py tests/test_torch_backend.py tests/test_torch_paper_validation.py tests/test_torch_observable_validation.py tests/test_torch_bcocb.py tests/test_rpmdrate_normal_modes.py tests/test_bcocb_mts.py tests/test_mixed_sampling.py tests/test_mixed_workflows.py
      - run: python benchmarks/nonadiabatic/electronic_backends.py --backends numpy native torch --torch-device cpu --output "$RUNNER_TEMP/electronic-backends-torch-cpu.json"
      - uses: actions/upload-artifact@v4
        with:
          name: electronic-backends-torch-cpu
          path: ${{ runner.temp }}/electronic-backends-torch-cpu.json
      - name: Test Torch reference harnesses from the source archive
        run: |
          python -m pip install build
          python -m build --sdist --outdir "$RUNNER_TEMP/torch-sdist"
          python - <<'PY'
          import os, pathlib, subprocess, sys, tarfile
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "torch-sdist"
          archives = list(destination.glob("*.tar.gz"))
          assert len(archives) == 1, archives
          with tarfile.open(archives[0]) as archive:
              archive.extractall(destination / "unpacked", filter="data")
          roots = list((destination / "unpacked").iterdir())
          assert len(roots) == 1, roots
          root = roots[0]
          subprocess.run([sys.executable, "setup.py", "build_ext", "--inplace"],
                         cwd=root, check=True)
          tests = ["tests/test_torch_backend.py", "tests/test_torch_paper_validation.py",
                   "tests/test_torch_observable_validation.py", "tests/test_torch_bcocb.py",
                   "tests/test_rpmdrate_normal_modes.py", "tests/test_bcocb_mts.py",
                   "tests/test_mixed_sampling.py", "tests/test_mixed_workflows.py"]
          subprocess.run([sys.executable, "-m", "pytest", "-q", *tests], cwd=root,
                         env={**os.environ, "PYTHONPATH": str(root / "src")}, check=True)
          PY
  molecular-dpem:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python -m pip install -e '.[test]'
      - run: python benchmarks/molecular_nonadiabatic/compare_fortran.py --output "$RUNNER_TEMP/nah2-original-fortran.json"
      - run: pyrpmd validate benchmarks/molecular_nonadiabatic/nah2_nrpmd.inp --check-pes
      - run: pyrpmd run benchmarks/molecular_nonadiabatic/nah2_nrpmd.inp --output "$RUNNER_TEMP/nah2-nrpmd"
      - run: pyrpmd run benchmarks/molecular_nonadiabatic/nah2_rpsh.inp --output "$RUNNER_TEMP/nah2-rpsh"
      - name: Extended-method CLI examples
        run: |
          for input in examples/nonadiabatic/extensions/*.inp; do
            pyrpmd validate "$input" --check-pes
            pyrpmd run "$input" --output "$RUNNER_TEMP/extensions/$(basename "$input" .inp)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: molecular-nonadiabatic-reference
          path: |
            ${{ runner.temp }}/nah2-original-fortran.json
            ${{ runner.temp }}/nah2-nrpmd/results/summary.json
            ${{ runner.temp }}/nah2-rpsh/results/summary.json
  electronic-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,ase,tblite,pyscf]'
      - run: python -m pytest -q tests/test_potential_adapters.py
  library-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q -m "not campaign"
  library-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      # Keep checked-in scientific fixtures and source hashes byte-identical.
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q -m "not campaign"
