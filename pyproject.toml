[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyRPMD"
version = "0.2.0"
description = "Ring-polymer dynamics, reaction networks and adaptive free-energy sampling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
authors = [{name = "PyRPMD contributors"}]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py>=3.10", "threadpoolctl>=3.1"]

[project.urls]
Repository = "https://github.com/chen-yu-hao/PyRPMD"
Documentation = "https://github.com/chen-yu-hao/PyRPMD/blob/main/docs/index.md"
Issues = "https://github.com/chen-yu-hao/PyRPMD/issues"

[project.optional-dependencies]
mpi = ["mpi4py>=3.1"]
gpu = ["torch>=2.2"]
ase = ["ase>=3.23"]
openmm = ["openmm>=8.2"]
lammps = ["lammps>=2024.8.29"]
mace = ["mace-torch>=0.3.10", "ase>=3.23"]
nequip = ["nequip>=0.7", "ase>=3.23"]
deepmd = ["deepmd-kit>=3"]
fairchem = ["fairchem-core>=2", "ase>=3.23"]
mace-batched = ["mace-torch>=0.3.17,<0.4", "vesin[torch]>=0.6.2,<0.7"]
nequip-batched = ["nequip>=0.19.1,<0.20", "torch>=2.4", "vesin>=0.6.2,<0.7"]
nequip-batched-aoti = ["nequip>=0.19.1,<0.20", "torch>=2.13,<2.14", "vesin>=0.6.2,<0.7"]
nequip-batched-cuda = ["nequip>=0.19.1,<0.20", "torch>=2.4", "nvalchemi-toolkit-ops>=0.3,<0.6"]
fairchem-batched = ["fairchem-core>=2.25,<2.26"]
deepmd-batched = ["deepmd-kit[torch]>=3.2,<3.3", "vesin[torch]>=0.6.2,<0.7"]
metatomic = ["metatomic-torch>=0.1.19,<0.2", "torch>=2.4", "vesin[torch]>=0.6.2,<0.7"]
tblite = ["tblite>=0.4"]
xtb = ["tblite>=0.4"]
pyscf = ["pyscf>=2.6"]
analysis = ["pymbar>=4", "matplotlib>=3.8"]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]
pesgen = ["pyscf>=2.8,<3"]
docs = ["sphinx>=8.2,<9", "myst-parser>=4,<5", "pydata-sphinx-theme>=0.16,<0.17"]

[project.scripts]
pyrpmd = "pyrpmd.cli:main"
pyrpmd-native = "pyrpmd.native_ensemble:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "campaign: validation campaign tests that depend on benchmark code or data",
]


[tool.setuptools.package-data]
"pyrpmd" = ["templates/*.inp"]
"pyrpmd.pesgen" = ["_native/*.cpp", "_native/*.f90", "_native/*.h"]
"pyrpmd.potentials" = ["_licenses/*.txt"]


[tool.cibuildwheel]
# The ordinary GIL-enabled CPython ABI only; free-threaded builds are not certified.
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-command = "python {project}/tests/wheel_smoke.py"
environment = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1" }

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
