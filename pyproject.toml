[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyRPMD"
version = "0.2.0"
description = "Ring-polymer dynamics, reaction networks and adaptive free-energy sampling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PyRPMD contributors"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py>=3.10", "threadpoolctl>=3.1"]

[project.optional-dependencies]
mpi = ["mpi4py>=3.1"]
gpu = ["torch>=2.2"]
ase = ["ase>=3.23"]
analysis = ["pymbar>=4"]
test = ["pytest>=8"]
pesgen = ["pyscf>=2.8,<3"]
docs = ["sphinx>=8.2,<9", "myst-parser>=4,<5", "pydata-sphinx-theme>=0.16,<0.17"]

[project.scripts]
pyrpmd = "pyrpmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


[tool.setuptools.package-data]
"pyrpmd.pesgen" = ["_native/*.cpp", "_native/*.f90", "_native/*.h"]
